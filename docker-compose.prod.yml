services:
  webserver:
    image: nginx:latest
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    ports:
      - '80:80'
      - '443:443'
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    volumes:
      - ./nginx/conf/:/etc/nginx/conf.d/:ro
      - ./certbot/www/:/var/www/certbot/:ro
      - ./certbot/conf/:/etc/nginx/ssl/:rw
      - /var/log/nginx:/var/log/nginx  
    depends_on:
      - btp_app_prod
    networks:
      - btp-app-network


  certbot:
    image: certbot/certbot:latest
    command: certonly --webroot --webroot-path /var/www/certbot/
            -d btp.iamcristinadev.xyz
            --email arcusi.cristina95@gmail.com
            --agree-tos
            --non-interactive
            --keep-until-expiring
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - btp-app-network
    volumes:
      - ./certbot/www/:/var/www/certbot/:rw
      - ./certbot/conf/:/etc/letsencrypt/:rw

  btp_app_prod:
    # build:
    #   context: .
    #   dockerfile: Dockerfile.prod
    image:  miksiei2024/btp_app_prod:latest 
    container_name: pro_renovation_frontend
    ports:
      - "3030:3030"
    restart: unless-stopped
    networks:
      - btp-app-network
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3030/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
  

networks:
  btp-app-network:
    driver: bridge
