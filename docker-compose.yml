services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pro_renovation_frontend_dev
    ports:
      - "3030:3030"
    volumes:
      - .:/app                    # bind mount → hot reload
      - /app/node_modules         # garde les node_modules du container
    environment:
      - CHOKIDAR_USEPOLLING=true  
