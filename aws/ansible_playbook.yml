---
- name: Nettoyage et installation propre de Docker
  hosts: awsservers
  become: true
  remote_user: ubuntu

  tasks:
    - name: Arrêter Docker s'il est en cours d'exécution
      systemd:
        name: docker
        state: stopped
      ignore_errors: yes

    - name: Supprimer les anciennes versions de Docker et dépôts
      apt:
        name:
          - docker
          - docker-engine
          - docker.io
          - containerd
          - runc
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: absent
        purge: yes
      ignore_errors: yes

    - name: Supprimer les anciens dépôts Docker
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/docker.list
        - /etc/apt/sources.list.d/docker.list.save
        - /usr/share/keyrings/docker-archive-keyring.gpg
        - /etc/apt/keyrings/docker.gpg

    - name: Nettoyer le cache APT
      apt:
        autoclean: yes
        autoremove: yes

    - name: Mise à jour complète du cache APT
      apt:
        update_cache: yes
        cache_valid_time: 0
        force_apt_get: yes

    - name: Installer les prérequis
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Créer le répertoire keyrings
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Télécharger et installer la clé GPG de Docker (Ubuntu)
      shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Ajouter le dépôt Docker Ubuntu
      apt_repository:
        repo: 'deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable'
        state: present
        filename: docker

    - name: Mise à jour du cache APT avec le nouveau dépôt
      apt:
        update_cache: yes

    - name: Installer Docker Engine
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Démarrer et activer Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Ajouter l'utilisateur au groupe docker
      user:
        name: '{{ ansible_user }}'
        groups: docker
        append: yes

    - name: Attendre que Docker soit complètement démarré
      wait_for:
        timeout: 10

    - name: Vérifier les versions installées
      shell: |
        docker --version
        docker compose version
      register: versions
      changed_when: false

    - name: Afficher les résultats
      debug:
        msg:
          - "✅ Installation terminée avec succès!"
          - "{{ versions.stdout_lines }}"
          - ""
          - "⚠️  IMPORTANT: Pour utiliser Docker sans sudo, reconnectez-vous:"
          - "   exit"
          - "   ssh ubuntu@{{ inventory_hostname }}"

    - name: Test final avec hello-world
      command: docker run --rm hello-world
      register: test_result
      changed_when: false
      ignore_errors: yes

    - name: Afficher le résultat du test
      debug:
        msg: "{{ test_result.stdout_lines }}"
      when: test_result is succeeded