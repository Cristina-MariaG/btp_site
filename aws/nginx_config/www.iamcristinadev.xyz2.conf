
# Configuration nginx APRÈS génération du certificat SSL
# Compatible avec nginx < 1.25.1

server {
    listen 80;
    listen [::]:80;

    server_name iamcristinadev.xyz www.iamcristinadev.xyz;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://iamcristinadev.xyz$request_uri;
    }
}


server {
    listen 443 ssl default_server;
    listen [::]:443 ssl;
    http2 on;

    server_name iamcristinadev.xyz;

    ssl_certificate /etc/nginx/ssl/live/iamcristinadev.xyz/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/iamcristinadev.xyz/privkey.pem;
    
    # Paramètres SSL sécurisés
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    
    location / {
        proxy_pass http://app-prod:3000;
        proxy_redirect off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900;
    }
}
